# NGINX configuration for API gateway and load balancing

# Define upstreams for each backend microservice
upstream user_service {
    server user-service:8000;
}

upstream hw_service {
    server hw-service:8000;
}

upstream notification_service {
    server notification-service:8000;
}

server {
    listen 80;

    # Route /users/* requests to user-service
    location /users/ {
        proxy_pass http://user_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Route /homework/* requests to hw-service
    location /homework/ {
        proxy_pass http://hw_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Route /notifications/* requests to notification-service
    location /notifications/ {
        proxy_pass http://notification_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # simple gateway health
    location = /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}